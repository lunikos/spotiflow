name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: spotiflow-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: spotiflow-macos-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: spotiflow-linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, asset: spotiflow-linux-arm64, linker: gcc-aarch64-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: spotiflow-windows-x86_64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: spotiflow-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.linker
        run: |
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/spotiflow
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
