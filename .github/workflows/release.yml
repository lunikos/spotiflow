name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: spotiflow-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: spotiflow-macos-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: spotiflow-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: spotiflow-linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: spotiflow-windows-x86_64.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: spotiflow-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/spotiflow
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber || gh release create "$GITHUB_REF_NAME" "${{ matrix.asset }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
