name: sync
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  spotx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --release -- update --assets
      - name: Open a pull request if SpotX-Bash changed
        run: |
          git diff --quiet && exit 0
          cargo test
          branch="sync/spotx-$(cut -c1-7 assets/patches/source.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Sync SpotX-Bash patch set to $(cut -c1-7 assets/patches/source.txt)"
          git push -u origin "$branch"
          gh pr create --fill --body "Patch set regenerated by \`spotiflow update --assets\`. Run the parity test against a real client before merging."
        env:
          GH_TOKEN: ${{ github.token }}
